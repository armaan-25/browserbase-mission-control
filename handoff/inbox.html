<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Handoff inbox</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --line:#e2e2de; --text:#1b1b1a; --dim:#6b6b66;
          --accent:#1d5fd1; --ok:#1e7a45; --warn:#a2560b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1d1d1c; --line:#2f2f2d; --text:#ececea; --dim:#9a9a94;
            --accent:#6ea0ff; --ok:#5cc98c; --warn:#f0a55a; --bad:#ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .state.open { color: var(--warn); } .state.handed_back { color: var(--ok); } .state.expired { color: var(--bad); }
  .reason { font-size: 17px; font-weight: 600; margin: 6px 0; }
  .meta { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .live { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
          aspect-ratio: 16 / 10; background: var(--bg); display: grid; place-items: center; }
  .live iframe { width: 100%; height: 100%; border: 0; }
  .live p { color: var(--dim); padding: 16px; text-align: center; margin: 0; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 8px 0 4px; }
  textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px; border-radius: 6px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  button { margin-top: 10px; font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px;
           border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .result { margin-top: 8px; font-size: 14px; }
  .result.bad { color: var(--bad); } .result.ok { color: var(--ok); }
  .receipt { margin-top: 10px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Handoff inbox</h1>
  <p class="sub">Agents waiting for a person. Act in the browser, then hand it back.</p>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script>
  // Cards are rebuilt only when a request's state changes, so an open Live View
  // is not reloaded while someone is using it.
  var list = document.getElementById("list");
  var rendered = {};
  var liveAvailable = false;

  function time(ms) {
    return ms ? new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) : "";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // One idempotency key per card, kept across refreshes, so resending after a
  // lost response is recognised as the same hand-back rather than a second one.
  function keyFor(requestId) {
    var k = "handback:" + requestId;
    var existing = null;
    try { existing = sessionStorage.getItem(k); } catch (e) {}
    if (existing) return existing;
    var made = crypto.randomUUID();
    try { sessionStorage.setItem(k, made); } catch (e) {}
    return made;
  }

  function handBack(item, note, button, result) {
    button.disabled = true;
    result.className = "result";
    result.textContent = "Handing back…";
    var body = JSON.stringify({
      generation: item.request.generation,
      idempotencyKey: keyFor(item.request.requestId),
      note: note.value.trim() || null
    });
    var attempt = 0;
    (function send() {
      attempt += 1;
      fetch("/api/requests/" + encodeURIComponent(item.request.requestId) + "/handback", {
        method: "POST", headers: { "content-type": "application/json" }, body: body
      }).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
        .then(function (res) {
          if (res.status === 200) {
            result.className = "result ok";
            result.textContent = res.body.replay ? "Already handed back (same click)." : "Handed back. The agent has the browser.";
            refresh();
          } else {
            result.className = "result bad";
            result.textContent = res.body.message || res.body.error;
          }
        })
        .catch(function () {
          // No answer: the hand-back may or may not have landed. Resending with
          // the same key is safe; the service returns the first result.
          if (attempt < 3) { setTimeout(send, 1000 * attempt); return; }
          result.className = "result bad";
          result.textContent = "No response from the service. Click again to resend the same hand-back.";
          button.disabled = false;
        });
    })();
  }

  function card(item) {
    var r = item.request;
    var c = el("section", "card");
    var head = el("div", "head");
    head.appendChild(el("span", "state " + r.state, r.state.replace("_", " ")));
    head.appendChild(el("span", "meta", r.kind + " · run " + r.runId + " · asked " + time(r.createdAt)));
    c.appendChild(head);
    c.appendChild(el("div", "reason", r.reason));
    c.appendChild(el("div", "meta", "Page when asked: " + (r.context.title || "untitled") + " — " + r.context.url));

    if (r.state === "open") {
      var live = el("div", "live");
      live.appendChild(el("p", null, liveAvailable ? "Loading live browser…" : "No Live View for a local browser: use the Chrome window the agent opened."));
      c.appendChild(live);
      if (liveAvailable) {
        fetch("/api/requests/" + encodeURIComponent(r.requestId) + "/live").then(function (x) { return x.json(); }).then(function (b) {
          live.textContent = "";
          if (!b.url) { live.appendChild(el("p", null, "Live View unavailable for this session.")); return; }
          var frame = document.createElement("iframe");
          frame.src = b.url;
          frame.setAttribute("sandbox", "allow-same-origin allow-scripts");
          frame.setAttribute("allow", "clipboard-read; clipboard-write");
          frame.setAttribute("referrerpolicy", "no-referrer");
          live.appendChild(frame);
        });
      }
      var noteLabel = el("label", null, "What you did (optional — never paste codes or passwords)");
      var note = el("textarea");
      noteLabel.appendChild(note);
      c.appendChild(noteLabel);
      var button = el("button", null, "Hand back to agent");
      var result = el("div", "result");
      button.onclick = function () { handBack(item, note, button, result); };
      c.appendChild(button);
      c.appendChild(result);
    } else {
      var receipt = el("div", "receipt");
      if (r.state === "handed_back") {
        receipt.appendChild(el("div", null, "Handed back " + time(r.handedBackAt) + (r.note ? " — “" + r.note + "”" : "")));
        receipt.appendChild(el("div", "meta", r.observation
          ? "Agent looked again " + time(r.observation.observedAt) + ": " + (r.observation.title || "untitled") + " — " + r.observation.url
          : "Agent has not looked at the page yet."));
      } else {
        receipt.appendChild(el("div", null, "The browser session ended before a hand-back. The agent was stopped, not resumed."));
      }
      c.appendChild(receipt);
    }
    return c;
  }

  function signature(item) {
    var r = item.request;
    return r.state + "|" + (r.observation ? 1 : 0);
  }

  function refresh() {
    fetch("/api/inbox").then(function (x) { return x.json(); }).then(function (data) {
      liveAvailable = data.live;
      if (data.items.length === 0) { list.innerHTML = '<p class="empty">No agents are waiting.</p>'; rendered = {}; return; }
      var seen = {};
      var empty = list.querySelector(".empty");
      if (empty) empty.remove();
      data.items.forEach(function (item, index) {
        var id = item.request.requestId;
        seen[id] = true;
        var existing = rendered[id];
        if (!existing || existing.sig !== signature(item)) {
          var node = card(item);
          if (existing) list.replaceChild(node, existing.node); else list.appendChild(node);
          rendered[id] = { node: node, sig: signature(item) };
        }
        if (list.children[index] !== rendered[id].node) list.insertBefore(rendered[id].node, list.children[index] || null);
      });
      Object.keys(rendered).forEach(function (id) {
        if (!seen[id]) { rendered[id].node.remove(); delete rendered[id]; }
      });
    }).catch(function () {});
  }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
